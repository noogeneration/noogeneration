<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>noogen</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="bar-frame-outer">
    <div class="bar-frame-middle">
      <div class="layout-bar">
        <section class="intro">
          <h1>noogen</h1>

          <p>
            welcome to the future of web design.
          </p>

          <p>
            this webpage is rendering in real-time with pure webgpu.
            click and drag to rotate, scroll to zoom.
          </p>

          <audio controls>
            <source src="./audio/deep_house_take5.ogg" type="audio/ogg">
            Your browser does not support the audio element.
          </audio>
        </section>

        <section class="views" aria-label="Interactive 3D models">
          <div
            class="view-port"
            data-model="./models/sphere_low.obj"
            data-bg="#fede00"
            data-wire="#8a9692"
            data-fov="30"
            data-distance="4.5"
            data-thickness="5"
          >
            <canvas></canvas>
          </div>

          <div
            class="view-port"
            data-model="cube"
            data-bg="#fede00"
            data-wire="#8a9692"
            data-fov="10"
            data-distance="20.0"
            data-thickness="5"
          >
            <canvas></canvas>
          </div>

          <div
            class="view-port"
            data-model="tetra"
            data-bg="#fede00"
            data-wire="#8a9692"
            data-fov="10"
            data-distance="20.0"
            data-thickness="5"
          >
            <canvas></canvas>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
